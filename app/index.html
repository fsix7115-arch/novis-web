<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/novis-web/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Novis — meet strangers anonymously with text chat, voice and video calls. No signup, 18+.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Novis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <meta name="theme-color" content="#2E1524">

  <title>Novis — Meet Strangers, Anonymously</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Premium launch splash: the P2 logo's brand world, shown until the
       Flutter app paints its first frame — never a plain white boot. */
    html, body { margin: 0; height: 100%; background: #2E1524; }
    #novis-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background:
        radial-gradient(420px 420px at 88% 96%, rgba(255,122,0,.30), rgba(255,122,0,0) 70%),
        linear-gradient(150deg, #472038 0%, #2E1524 55%, #1F0D18 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #novis-splash img {
      width: 96px; height: 96px; border-radius: 24px;
      box-shadow: 0 0 34px rgba(236,64,112,.40);
      animation: novis-pulse 1.8s ease-in-out infinite alternate;
    }
    #novis-splash .name { color: #fff; font-size: 30px; font-weight: 600; letter-spacing: .4px; }
    #novis-splash .tag { color: #DFBFA9; font-size: 14px; margin-top: -12px; }
    @keyframes novis-pulse {
      from { box-shadow: 0 0 22px rgba(236,64,112,.25); }
      to   { box-shadow: 0 0 44px rgba(255,158,69,.50); }
    }
  </style>
</head>
<body>
  <div id="novis-splash">
    <img src="icons/Icon-192.png" alt="Novis">
    <div class="name">Novis</div>
    <div class="tag">Meet someone new. No logins, no strings.</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('novis-splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 400); }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
