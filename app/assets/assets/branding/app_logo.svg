<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <linearGradient id="logoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>
    <linearGradient id="logoVioletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B388FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10) scale(0.27)">
    <circle cx="256" cy="256" r="140" fill="#00E5FF" opacity="0.2" filter="url(#logoGlow)"/>
    <ellipse cx="216" cy="256" rx="100" ry="130" fill="none" stroke="url(#logoVioletGrad)" stroke-width="26" stroke-linecap="round" transform="rotate(-25 216 256)" filter="url(#logoGlow)"/>
    <ellipse cx="296" cy="256" rx="100" ry="130" fill="none" stroke="url(#logoCyanGrad)" stroke-width="26" stroke-linecap="round" transform="rotate(25 296 256)" filter="url(#logoGlow)"/>
    <circle cx="256" cy="256" r="22" fill="#FFFFFF" filter="url(#logoGlow)"/>
    <circle cx="256" cy="256" r="14" fill="#00E5FF"/>
  </g>

  <!-- Text Mark: NOVIS -->
  <text x="175" y="98" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="8">NOVIS</text>
  <!-- Subtitle -->
  <text x="178" y="128" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="14" font-weight="600" fill="#00E5FF" letter-spacing="3">ANONYMOUS STRANGER CONNECT</text>
</svg>
