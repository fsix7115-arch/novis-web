<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="50%" stop-color="#101726"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>

    <!-- Ring Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>

    <!-- Ring Violet Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B388FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Center Pulse Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#7C4DFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="3"/>

  <!-- Subtle Ambient Glow Behind Rings -->
  <circle cx="256" cy="256" r="140" fill="url(#centerGlow)" filter="url(#glow)"/>

  <!-- Left Stranger Orbital Arc (Violet) -->
  <ellipse cx="216" cy="256" rx="100" ry="130" 
           fill="none" 
           stroke="url(#violetGrad)" 
           stroke-width="24" 
           stroke-linecap="round"
           transform="rotate(-25 216 256)"
           filter="url(#glow)"
           opacity="0.9" />

  <!-- Right Stranger Orbital Arc (Cyan) -->
  <ellipse cx="296" cy="256" rx="100" ry="130" 
           fill="none" 
           stroke="url(#cyanGrad)" 
           stroke-width="24" 
           stroke-linecap="round"
           transform="rotate(25 296 256)"
           filter="url(#glow)"
           opacity="0.95" />

  <!-- Convergence Focal Nodes -->
  <circle cx="256" cy="256" r="22" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="14" fill="#00E5FF"/>
  
  <!-- Subtle Constellation Accent Nodes -->
  <circle cx="160" cy="180" r="6" fill="#B388FF" opacity="0.8"/>
  <circle cx="352" cy="332" r="6" fill="#00E5FF" opacity="0.8"/>
</svg>
